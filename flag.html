<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Flag Overlay</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:transparent}canvas{display:none;position:fixed;left:0;top:0}</style>
</head><body>
<script src="three.min.js"></script>
<script>
// Yellow penalty flag: a real-time WebGL (Three.js) cloth on a pole that rises from behind the scoreboard,
// ripples in the wind for a few seconds, then sinks back out of sight. Everything below the middle of the
// scoreboard is clipped away, so the pole always appears to come from behind the board.
const T_RISE=1.15, T_HOLD=3.6, T_LOWER=1.0, T_TOTAL=T_RISE+T_HOLD+T_LOWER; // seconds

const R=new THREE.WebGLRenderer({alpha:true,antialias:true,premultipliedAlpha:true});
R.setClearColor(0,0);R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;
const cv=R.domElement;document.body.appendChild(cv);
const scene=new THREE.Scene(),FOV=24,CZ=18,cam=new THREE.PerspectiveCamera(FOV,1,.1,100);cam.position.set(0,0,CZ);
let upp=1,VH=1; // upp = world units per CSS pixel on the z=0 plane, VH = world height of the viewport
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
 VH=2*CZ*Math.tan(FOV*Math.PI/360);upp=VH/innerHeight}
addEventListener('resize',()=>{resize();if(active)layout()});resize();

scene.add(new THREE.HemisphereLight(0xfff4d0,0x5a3c00,.42));
const key=new THREE.DirectionalLight(0xffffff,1.05);key.position.set(-6,3,5);scene.add(key);   // raking light from the pole side so the folds throw shadows
const rim=new THREE.DirectionalLight(0xffe08a,.55);rim.position.set(7,-3,-4);scene.add(rim);

// cloth texture: yellow weave, darker hem where it wraps the pole, faint stitching
function clothTex(){
 const c=document.createElement('canvas');c.width=512;c.height=320;const g=c.getContext('2d');
 const gr=g.createLinearGradient(0,0,512,0);gr.addColorStop(0,'#e8a800');gr.addColorStop(.5,'#f7c600');gr.addColorStop(1,'#ffd21a');
 g.fillStyle=gr;g.fillRect(0,0,512,320);
 g.globalAlpha=.07;g.fillStyle='#000';for(let y=0;y<320;y+=3)g.fillRect(0,y,512,1);for(let x=0;x<512;x+=3)g.fillRect(x,0,1,320);g.globalAlpha=1;
 g.fillStyle='rgba(110,70,0,.38)';g.fillRect(0,0,24,320);
 g.strokeStyle='rgba(120,80,0,.28)';g.lineWidth=2;g.setLineDash([9,6]);g.strokeRect(36,10,466,300);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
const TEX=clothTex();

const SX=46,SY=28;
let SC=1,W=1,H=1,Lp=1,vw=1,geo=null,cloth=null,poleG=null,group=new THREE.Group(),U,V,RX,RY,NV;
scene.add(group);
const cloMat=new THREE.MeshStandardMaterial({map:TEX,roughness:.8,metalness:0,side:THREE.DoubleSide});
const poleMat=new THREE.MeshStandardMaterial({color:0xe6e6e6,roughness:.35,metalness:.55});
const capMat=new THREE.MeshStandardMaterial({color:0xffc400,roughness:.3,metalness:.6});

// (re)build everything in world units from the current screen width so the flag scales with the overlay
function build(){
 while(group.children.length){const o=group.children.pop();o.geometry&&o.geometry.dispose()}
 vw=innerWidth/100*upp*SC;W=18*vw;H=10.5*vw;Lp=19*vw;
 geo=new THREE.PlaneGeometry(W,H,SX,SY);geo.translate(W/2,-H/2,0); // pole edge at x=0, top edge at y=0
 const p=geo.attributes.position;NV=p.count;U=new Float32Array(NV);V=new Float32Array(NV);RX=new Float32Array(NV);RY=new Float32Array(NV);
 for(let i=0;i<NV;i++){RX[i]=p.getX(i);RY[i]=p.getY(i);U[i]=RX[i]/W;V[i]=-RY[i]/H}
 cloth=new THREE.Mesh(geo,cloMat);cloth.position.set(.34*vw,-.55*vw,0);group.add(cloth);
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.16*vw,.2*vw,Lp+.9*vw,16),poleMat);pole.position.set(0,-Lp/2+.45*vw,0);group.add(pole);
 const cap=new THREE.Mesh(new THREE.SphereGeometry(.42*vw,20,14),capMat);cap.position.set(0,.95*vw,0);group.add(cap);
 // little base collar so the pole looks seated behind the board
 const col=new THREE.Mesh(new THREE.CylinderGeometry(.3*vw,.3*vw,.5*vw,16),capMat);col.position.set(0,-Lp+.4*vw,0);group.add(col);
}

// cloth shape for time t (seconds) and wind strength amp (0 = limp, 1 = full)
function wave(t,amp){
 const p=geo.attributes.position,drop=(1-amp);
 const A=.17*W, th=-drop*1.25; // limp cloth swings down alongside the pole
 const ct=Math.cos(th),st=Math.sin(th);
 for(let i=0;i<NV;i++){
  const u=U[i],v=V[i];
  const gust=.8+.2*Math.sin(t*.9+u*2.2);
  const a=amp*A*Math.pow(u,.95)*gust;
  const z=a*(.62*Math.sin(u*9.5-t*5.6+v*1.1)+.34*Math.sin(u*16-t*7.8+v*2.6+1.2)+.1*Math.sin(u*23-t*10.8+v*4.2));
  let x=RX[i]*(1-.09*amp*u*u)-z*.12;
  let y=RY[i]-.045*H*amp*u*u*(1+.5*Math.sin(t*1.3+v*2))+.05*H*a/A*u*Math.sin(t*1.8+u*5+v*1.4);
  p.setXYZ(i,x*ct-y*st,x*st+y*ct,z);
 }
 p.needsUpdate=true;geo.computeVertexNormals();
}

const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const outBack=x=>{const c1=1.1,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};

let active=false,t0=0,yClip=0,clipPx=0;
function layout(){
 // pole sits 12vw left of centre so the cloth is centred on the board
 build();group.position.x=-W/2; // pole at the left end so the cloth is centred on the board
 yClip=-VH/2+clipPx*upp;
 cv.style.clipPath='inset(0 0 '+clipPx+'px 0)';
}
function frame(now){
 if(!active)return;
 const t=(now-t0)/1000;
 if(t>=T_TOTAL){active=false;cv.style.display='none';parent.postMessage('flag-done','*');return}
 let r,amp;
 if(t<T_RISE){const k=t/T_RISE;r=outBack(k);amp=ss(.12,1,k)}
 else if(t<T_RISE+T_HOLD){r=1;amp=1}
 else{const k=(t-T_RISE-T_HOLD)/T_LOWER,e=k*k*k;r=1-e;amp=1-.5*ss(0,1,k)}
 const top1=yClip+Lp, top0=yClip-2.0*vw;
 group.position.y=top0+(top1-top0)*r;
 group.rotation.y=-.62+.12*Math.sin(t*.6);
 group.rotation.z=.02*Math.sin(t*1.1);
 wave(t*1.0+3,Math.max(0,amp));
 R.render(scene,cam);
 requestAnimationFrame(frame);
}
function play(clip,scale){
 SC=Math.min(3,Math.max(.3,+scale||1));clipPx=Math.max(0,+clip||0);resize();layout();
 cv.style.display='block';active=true;t0=performance.now();
 requestAnimationFrame(frame);
}
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='play')play(d.clip,d.scale);
 if(d&&d.type==='stop'){active=false;cv.style.display='none'}});
// test hook: ?demo in the URL plays it once on load
if(/[?&]demo/.test(location.search)){const m=/[?&]at=([\d.]+)/.exec(location.search);
 if(m){clipPx=innerWidth*.048;resize();layout();cv.style.display='block';active=true;const T=+m[1];
  const f=(r,amp,t)=>{const top1=yClip+Lp,top0=yClip-2.0*vw;group.position.y=top0+(top1-top0)*r;group.rotation.y=-.62+.12*Math.sin(t*.6);wave(t+3,amp);R.render(scene,cam)};
  const k=Math.min(1,T/T_RISE);f(T<T_RISE?outBack(k):1,T<T_RISE?ss(.12,1,k):1,T);active=false}
 else setTimeout(()=>play(innerWidth*.048),200)}
</script>
</body></html>
