html,body{margin:0;height:100%;overflow:hidden;background:transparent;-webkit-font-smoothing:antialiased}
#snd{position:fixed;top:1.2vw;right:1.2vw;z-index:200;display:none;padding:.7vw 1.3vw;border-radius:99px;background:#19c3ff;color:#00212e;font:700 1.3vw/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 0 1.5vw rgba(25,195,255,.7);animation:sndp 1.4s ease-in-out infinite}
#snd.on{display:block}@keyframes sndp{50%{transform:scale(1.06)}}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;display:none;background:#000}#cam.on{display:block}
#camtap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:300;display:none;padding:2vw 3vw;border-radius:99px;background:#19c3ff;color:#00212e;font:800 2.4vw system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;pointer-events:none}
:root{--s:.8vw;--g:.2vw;--h:3.6vw}
#sb{position:fixed;left:50%;bottom:var(--bot,3vw);transform:translateX(-50%) scale(var(--sbs,1));transform-origin:50% 100%;transition:transform .85s cubic-bezier(.22,.9,.25,1);will-change:transform}
#sb.off{transform:translate(-50%,calc(100% + var(--bot,3vw) + 5vw)) scale(var(--sbs,1));transition-timing-function:cubic-bezier(.55,0,.85,.35)}
.bar{position:relative;z-index:2;display:flex;height:var(--h);filter:drop-shadow(0 .4vw .7vw rgba(0,0,0,.6))}
.j{margin-left:calc(var(--g) - var(--s))}

/* ---------- team plates ---------- */
.team{position:relative;flex:none;width:17.6vw;display:flex;align-items:center;background:var(--c);color:var(--t);
 transition:background .4s,color .4s}
.team.L{clip-path:polygon(var(--s) 0,100% 0,calc(100% - var(--s)) 100%,0 100%);padding:0 calc(var(--s) + 1.45vw) 0 calc(var(--s) + .35vw)}
.team.R{clip-path:polygon(0 0,calc(100% - var(--s)) 0,100% 100%,var(--s) 100%);padding:0 calc(var(--s) + .35vw) 0 calc(var(--s) + 1.45vw);flex-direction:row-reverse}
.team::before{content:'';position:absolute;inset:0;pointer-events:none;
 background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 .14vw,rgba(255,255,255,0) .14vw .46vw),
 linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 48%,rgba(0,0,0,.28))}
.logo{position:relative;width:3vw;height:3vw;flex:none;display:flex;align-items:center;justify-content:center;margin:0 .55vw}
.logo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 .12vw .22vw rgba(0,0,0,.5))}
.team.nologo .logo{display:none}
.team.nologo.L{padding-left:calc(var(--s) + 1.1vw)}.team.nologo.R{padding-right:calc(var(--s) + 1.1vw)}
.info{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1}
.nw{width:100%;overflow:visible}.team.R .nw{text-align:right}
.name{display:inline-block;white-space:nowrap;font:700 1.65vw/1.05 RC,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.035em;text-shadow:0 .08vw .16vw rgba(0,0,0,.28)}
.sub{display:flex;align-items:center;gap:.6vw;margin-top:.22vw}.team.R .sub{flex-direction:row-reverse}
.rec{font:700 .8vw/1 RC,'Arial Narrow',sans-serif;letter-spacing:.12em;opacity:.88}
.tos{display:flex;gap:.26vw}
.tos i{width:1.1vw;height:.27vw;border-radius:.2vw;background:var(--t);transition:opacity .4s,background .4s,box-shadow .4s}
.tos i.used{background:transparent;box-shadow:inset 0 0 0 .07vw var(--t);opacity:.42}
.tos i.burn{animation:burn .8s ease-out}
@keyframes burn{0%{transform:scaleY(3);filter:brightness(2.2)}100%{transform:none;filter:none}}
.pl{position:absolute;left:0;right:0;bottom:0;height:.22vw;background:var(--t);transform:scaleX(0);transition:transform .55s cubic-bezier(.2,1,.3,1);z-index:2}
.team.has .pl{transform:scaleX(1)}
.ball{position:absolute;top:50%;width:1.45vw;height:1.45vw;margin-top:-.72vw;color:var(--t);opacity:0;transform:scale(.3) rotate(-90deg);
 transition:opacity .35s,transform .55s cubic-bezier(.2,1.5,.3,1);filter:drop-shadow(0 0 .3vw rgba(0,0,0,.35))}
.ball *{stroke:var(--c);transition:stroke .4s}
.team.L .ball{right:calc(var(--s) + .35vw)}.team.R .ball{left:calc(var(--s) + .35vw)}
.team.has .ball{opacity:1;transform:none;animation:ballp 2.4s ease-in-out .6s infinite}
@keyframes ballp{0%,100%{filter:drop-shadow(0 0 .15vw rgba(0,0,0,.35))}50%{filter:drop-shadow(0 0 .5vw var(--t))}}

/* ---------- score boxes ---------- */
.sw{position:relative;flex:none;width:5.3vw;height:100%}
.score{position:absolute;inset:0;overflow:hidden;background:var(--sb);color:var(--st)}
.sw.L .score{clip-path:polygon(var(--s) 0,100% 0,calc(100% - var(--s)) 100%,0 100%)}
.sw.R .score{clip-path:polygon(0 0,calc(100% - var(--s)) 0,100% 100%,var(--s) 100%)}
.score::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%,rgba(0,0,0,.14))}
.score::after{content:'';position:absolute;left:0;right:0;bottom:0;height:.26vw;z-index:4;background:var(--c);transition:background .4s}
.num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:.1vw;font:700 2.9vw/1 RC,'Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}
.num.in{animation:rIn .55s cubic-bezier(.2,1.4,.3,1) both}
.num.out{animation:rOut .38s cubic-bezier(.55,0,.8,.4) both}
.num.in.dn{animation-name:rInD}.num.out.dn{animation-name:rOutD}
@keyframes rIn{from{transform:translateY(105%) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes rOut{to{transform:translateY(-105%);opacity:0}}
@keyframes rInD{from{transform:translateY(-105%) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes rOutD{to{transform:translateY(105%);opacity:0}}
.fl{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 55%,rgba(var(--cr,255,255,255),.95),rgba(var(--cr,255,255,255),0) 72%)}
.fl.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.delta{position:absolute;left:50%;bottom:100%;margin-bottom:.15vw;padding:.12vw .55vw;border-radius:.4vw;background:var(--c);color:var(--t);
 font:700 1.35vw/1 RC,'Arial Narrow',sans-serif;opacity:0;pointer-events:none;white-space:nowrap;box-shadow:0 0 .8vw rgba(var(--cr,255,255,255),.6)}
.delta.neg{background:#2a2d36;color:#fff;box-shadow:none}
.delta.go{animation:dlt 1.9s ease-out both}

/* ---------- entrance (runs each time the board slides up) ---------- */

.penclip{position:absolute;z-index:1;bottom:calc(var(--h) - .2vw);width:17.6vw;height:2.7vw;overflow:hidden;pointer-events:none}

 transform:translateY(110%);transition:transform .6s cubic-bezier(.2,1.1,.3,1)}
.penclip.L .pen{clip-path:polygon(calc(var(--s)*.6) 0,100% 0,calc(100% - var(--s)*.6) 100%,0 100%)}
.penclip.R .pen{clip-path:polygon(0 0,calc(100% - var(--s)*.6) 0,100% 100%,calc(var(--s)*.6) 100%)}

.pt{display:inline-block;white-space:nowrap;font:700 1.35vw/1 RC,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.07em}
</style></head><body>

<script>
const EMB=/[?&]embed=1/.test(location.search)&&parent!==window;
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),Q=['1st','2nd','Half','3rd','4th','OT'],ORD=['','1st','2nd','3rd','4th'];
const rgbOf=h=>{h=String(h||'').replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');const n=parseInt(h,16);return /^[0-9a-f]{6}$/i.test(h)?[n>>16,n>>8&255,n&255]:[128,128,128]};
const lum=h=>{const c=rgbOf(h);return(.299*c[0]+.587*c[1]+.114*c[2])/255};
let S=null,at=0,tdPhase='idle',tdTimer=null,tdCur=null,wasHidden=true,enterT=null,wasFlag=false,tagOn=false,tagT=null,tagPlayT=null,winOn=false,winT=null,winPlayT=null,breakOn=false,brkT=null,startOn=!EMB,stsT=null,stsReady=false,stsShown=false,stsPost=false;   // startOn: the STARTING SOON screen is on air (true from the moment the overlay loads)
const prevSc={},prevTo={};
const hidden=()=>!S||!S.sb||tdPhase==='down'||tdPhase==='playing'||tagOn||winOn||breakOn||startOn;
let lastBS=null;
function bugSync(){if(!S)return;const w=$('#bug').contentWindow;w.postMessage(S.bug&&!tagOn&&!winOn&&!breakOn&&!startOn?'show':'hide','*');const bs=S.bugScale||1;if(bs!==lastBS){lastBS=bs;w.postMessage({type:'scale',v:bs},'*')}}
$('#bug').addEventListener('load',()=>setTimeout(()=>{lastBS=null;bugSync()},300));
function fit(nm){nm.style.fontSize='';const w=nm.parentElement.clientWidth,n=nm.offsetWidth;if(n>w&&w>0)nm.style.fontSize=(parseFloat(getComputedStyle(nm).fontSize)*w/n)+'px'}
const retrig=(el,c)=>{el.classList.remove(c);void el.offsetWidth;el.classList.add(c)};
// score digits roll like a ticker; a "+6" chip pops up and the box flashes in the team color
function setScore(k,v){
 const sc=$('#'+k+'-sc'),p=prevSc[k];
 if(p===undefined){sc.innerHTML='<span class="num">'+v+'</span><i class="fl"></i>';prevSc[k]=v;return}
 if(p===v)return;
 const dn=v<p,old=sc.querySelector('.num:not(.out)'),n=document.createElement('span');
 n.className='num in'+(dn?' dn':'');n.textContent=v;
 if(old){old.className='num out'+(dn?' dn':'');setTimeout(()=>old.remove(),600)}
 sc.insertBefore(n,sc.querySelector('.fl'));retrig(sc.querySelector('.fl'),'go');
 const d=Math.abs(v-p);
 if(!dn||d<=7){const ch=$('#'+k+'-sw .delta');ch.textContent=(dn?'\u2212':'+')+d;ch.classList.toggle('neg',dn);retrig(ch,'go')}
 prevSc[k]=v}
function render(){
 const rs=document.documentElement.style,sb=$('#sb');
 rs.setProperty('--bot',(S.sbBottom==null?3:S.sbBottom)+'vw');rs.setProperty('--sbs',S.sbScale||1);
 const u=S.ui;
 rs.setProperty('--sb',u.scoreBg);rs.setProperty('--st',lum(u.scoreBg)>.55?'#111':'#fff');
 rs.setProperty('--qb',u.qtrBg);rs.setProperty('--qt',lum(u.qtrBg)>.55?'#111':'#fff');
 rs.setProperty('--db',u.ddBg);rs.setProperty('--dt',lum(u.ddBg)>.55?'#111':'#cfd1d8');
 for(const k of['home','away']){const t=S[k],el=$('#'+k),sw=$('#'+k+'-sw'),rgb=rgbOf(t.color).join(',');
  const fl=!!S.flag&&S.flag.team===k;el.classList.toggle('flagged',fl);
  for(const e of[el,sw]){e.style.setProperty('--c',fl?'#000':t.color);e.style.setProperty('--cr',rgb);e.style.setProperty('--t',fl?'#fff':t.tc)}
  rs.setProperty(k==='home'?'--ch':'--ca',t.color);
  el.classList.toggle('nologo',!t.logo);const im=el.querySelector('img');
  if(t.logo){if(im.getAttribute('src')!==t.logo)im.src=t.logo}else im.removeAttribute('src');
  const nm=el.querySelector('.name');if(nm.textContent!==t.name)nm.textContent=t.name;fit(nm);
  const rc=el.querySelector('.rec');rc.textContent=t.rec;rc.style.display=t.rec?'':'none';
  const pills=el.querySelectorAll('.tos i');
  pills.forEach((d,i)=>{const used=i>=t.to,was=d.classList.contains('used');d.classList.toggle('used',used);
   if(used&&!was&&prevTo[k]!==undefined)retrig(d,'burn')});prevTo[k]=t.to;
  el.classList.toggle('has',S.poss===k);
  setScore(k,t.score)}
 $('#qtr').textContent=Q[S.qtr];
 const F=S.flag||{team:'',pen:'',banner:false},fOn=!!F.banner;
 $('#clk').classList.toggle('hide',!S.showClock||fOn);
 const dn=S.down?(ORD[S.down]||S.down+'th')+' & '+(S.dist||'Goal'):'',sp=S.spot||'';
 const tray=$('#dd'),tcl=$('#trayclip');tcl.classList.toggle('show',!!(fOn||dn||sp));
 if(fOn){ // flag out: the tray turns yellow and says one word, the clock cell steps aside
  tcl.classList.add('flagon');tray.classList.add('flag','one');$('#dd1').textContent='FLAG';$('#dd1').style.display='';$('#dd2').style.display='none';
  tray.style.setProperty('--pc','#111');if(!wasFlag)retrig($('#dd1'),'slam')}
 else if(dn||sp){tcl.classList.remove('flagon');tray.classList.remove('flag');
  $('#dd1').textContent=dn;$('#dd1').style.display=dn?'':'none';$('#dd2').textContent=sp;$('#dd2').style.display=sp?'':'none';
  tray.classList.toggle('one',!(dn&&sp));
  const pt=S.poss&&S[S.poss];tray.style.setProperty('--pc',pt?pt.color:'rgba(255,255,255,.5)')}
 wasFlag=fOn;
 for(const k of['home','away']){const pc=$('#penclip-'+k),on=F.team===k&&!!F.pen;pc.classList.toggle('show',on);
  if(on){const pt=pc.querySelector('.pt'),txt=F.pen==='Unknown'?'Unknown penalty':F.pen;if(pt.textContent!==txt)pt.textContent=txt;fit(pt)}}
 const h=hidden();
 if(wasHidden&&!h){retrig(sb,'enter');clearTimeout(enterT);enterT=setTimeout(()=>sb.classList.remove('enter'),1800)}
 wasHidden=h;
 sb.classList.toggle('off',h);bugSync()}
function tick(){if(!S)return;let ms=S.clock.running?Math.max(0,S.clock.ms-(performance.now()-at)):S.clock.ms;
 const c=$('#clk'),t=ms<60000?(ms/1000).toFixed(1):Math.floor(ms/60000)+':'+pad(Math.floor(ms/1000)%60);
 if(c.textContent!==t)c.textContent=t;c.classList.toggle('low',ms>0&&ms<60000);c.classList.toggle('zero',ms<=0)}setInterval(tick,100);
// ---- touchdown: board slides down -> animation -> board slides up -> points are added
function runTD(d){
 if(tdPhase!=='idle')return;tdCur=d;const wait=S&&S.sb?900:50;
 tdPhase='down';if(S)render();
 setTimeout(()=>{tdPhase='playing';$('#td').contentWindow.postMessage({type:'play',td:{style:d.style,color:d.color,logo:d.logo}},'*')},wait);
 tdTimer=setTimeout(tdFinish,15000)}
function tdFinish(){
 if(tdPhase==='up'||tdPhase==='idle')return;clearTimeout(tdTimer);tdPhase='up';if(S)render();
 const d=tdCur,wait=S&&S.sb?950:50;
 setTimeout(()=>{tdPhase='idle';if(S)render();
  if(d&&d.id)fetch('/api/tddone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:d.id})})},wait)}
addEventListener('message',e=>{if(e.data==='td-done'&&e.source===$('#td').contentWindow)tdFinish()});
// ---- flag: the 3D flag rises from behind the board, waves a few seconds, then sinks away (the black team / FLAG tray / penalty tab are driven by state)
function playFlag(){if(!S||hidden())return;
 const sc=S.sbScale||1,clip=((S.sbBottom==null?3:S.sbBottom)+1.8*sc)*innerWidth/100; // the middle of the board: everything below is hidden
 $('#flag').contentWindow.postMessage({type:'play',clip,scale:sc},'*')}

// ---- CAMERA MODE: when the controller turns it on, the camera (+ mic) replaces the transparent background
const camEl=document.getElementById('cam'),camTap=document.getElementById('camtap');let camBusy=false,camStream=null;
async function camOn(){if(camBusy||camStream)return;camBusy=true;
 try{if(EMB){camStream=parent.GioCam&&parent.GioCam.stream;if(!camStream)return;camEl.muted=true}
  else{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:{echoCancellation:true,noiseSuppression:true}});camEl.muted=false}
  camEl.srcObject=camStream;camEl.classList.add('on');camTap.style.display='none';await camEl.play()}
 catch(e){camStream&&!EMB&&camStream.getTracks().forEach(t=>t.stop());camStream=null;if(!EMB)camTap.style.display='block';
  if(camEl.srcObject&&!camEl.muted){camEl.muted=true;camEl.play().catch(()=>{})}}finally{camBusy=false}}
function camOff(){camTap.style.display='none';camEl.classList.remove('on');camEl.srcObject=null;if(camStream&&!EMB)camStream.getTracks().forEach(t=>t.stop());camStream=null}
function camSync(){if(!S)return;camEl.style.transform='scale('+Math.min(5,Math.max(1,+S.camZoom||1))+')';S.cam?camOn():camOff()}
camTap.onclick=()=>camOn();addEventListener('click',()=>{if(camEl.srcObject&&camEl.muted&&!EMB){camEl.muted=false;camEl.play().catch(()=>{})}});
const es=new EventSource('/events?o=1');
es.addEventListener('flag',()=>playFlag());
// ---- channel tag: board + bug go away, the 3D tag plays, then everything comes back
function endTag(){if(!tagOn)return;clearTimeout(tagT);clearTimeout(tagPlayT);tagOn=false;if(S)render()}
// tag: {secs, hold}. Timed tags end on their own; hold tags stay up until the controller sends 'tagstop' (then the tag plays its exit).
es.addEventListener('tag',e=>{const d=JSON.parse(e.data);if(tagOn||winOn||breakOn||startOn||tdPhase!=='idle')return;tagOn=true;if(S)render();
 const secs=d.secs||6;
 clearTimeout(tagPlayT);tagPlayT=setTimeout(()=>{tagPlayT=null;$('#tag').contentWindow.postMessage({type:'play',stadium:d.stadium||'',secs,hold:!!d.hold},'*')},S&&S.sb?450:50);
 clearTimeout(tagT);tagT=d.hold?null:setTimeout(endTag,(secs+4)*1000)});
es.addEventListener('tagstop',()=>{if(!tagOn)return;
 if(tagPlayT){endTag();return}   // stopped before it even started
 $('#tag').contentWindow.postMessage({type:'end'},'*');clearTimeout(tagT);tagT=setTimeout(endTag,5000)});
// a touchdown always wins: cut the tag and let the touchdown animation have the bottom of the screen
function killTag(){clearTimeout(tagPlayT);tagPlayT=null;$('#tag').contentWindow.postMessage({type:'stop'},'*');endTag();fetch('/api/tagstop',{method:'POST'}).catch(()=>{})}
addEventListener('message',e=>{if(e.data==='tag-done'&&e.source===$('#tag').contentWindow)endTag();if(e.data==='break-done'&&e.source===$('#brk').contentWindow)finishBreak()});
es.onmessage=e=>{S=JSON.parse(e.data);at=performance.now();render();camSync();brkState();stsState();stsSync();winState()};
es.addEventListener('trigger',e=>{const d=JSON.parse(e.data);if(breakOn||startOn||winOn)return;if(tagOn)killTag();runTD(d)});
// SHOW WINNER: board + bug leave, win.html plays the winner's 3D logo + "TEAM WINS!" then the final score and HOLDS until the controller hides it ('winend').
const winWin=()=>$('#win').contentWindow,winDone=()=>fetch('/api/windone',{method:'POST'}).catch(()=>{});
const winInfoOf=d=>({name:d.name||'',winner:d.team,away:{name:d.away.name,score:d.away.score},home:{name:d.home.name,score:d.home.score}});
function winState(){if(!S||!winOn||!S.winTeam)return;const w=S[S.winTeam];if(!w)return;
 winWin().postMessage({type:'state',info:winInfoOf({team:S.winTeam,name:w.name,away:S.away,home:S.home})},'*')}
function finishWin(){if(!winOn)return;clearTimeout(winT);clearTimeout(winPlayT);winPlayT=null;winOn=false;try{winWin().postMessage({type:'stop'},'*')}catch(e){}if(S)render();winDone()}
es.addEventListener('win',e=>{const d=JSON.parse(e.data);
 if(winOn||breakOn||startOn||tdPhase!=='idle'){winDone();return}   // can't play now: release the controller's toggle
 if(tagOn)killTag();
 winOn=true;if(S)render();
 clearTimeout(winPlayT);winPlayT=setTimeout(()=>{winPlayT=null;winWin().postMessage({type:'play',td:{style:d.style,color:d.color,logo:d.logo},info:winInfoOf(d)},'*')},S&&S.sb?900:50)});

addEventListener('message',e=>{if(e.data==='win-done'&&e.source===winWin())finishWin()});
// AD BREAK: board + bug leave (their normal exit animations), then break.html fades the screen to black and shows the break screen.
// 'breakend': break.html fades its content to black, then fades the black away, and tells us 'break-done' - only then do the board + bug come back.
const brkWin=()=>$('#brk').contentWindow;
function brkState(){if(!S||!breakOn)return;const pk=t=>({score:t.score,color:t.color,logo:t.logo||''});brkWin().postMessage({type:'state',away:pk(S.away),home:pk(S.home),scoreBg:S.ui&&S.ui.scoreBg},'*')}
function finishBreak(){if(!breakOn)return;clearTimeout(brkT);breakOn=false;if(S)render();bugSync();fetch('/api/breakdone',{method:'POST'}).catch(()=>{})}
es.addEventListener('break',()=>{if(breakOn||startOn||tdPhase!=='idle')return;if(tagOn)killTag();breakOn=true;if(S)render();
 clearTimeout(brkT);brkT=setTimeout(()=>{brkState();brkWin().postMessage({type:'show'},'*')},S&&(S.sb||S.bug)?1000:50)});
es.addEventListener('breakend',()=>{if(!breakOn)return;clearTimeout(brkT);brkWin().postMessage({type:'hide'},'*');brkT=setTimeout(finishBreak,6000)});
// STARTING SOON: the overlay shows it every time it loads, no matter what (board + bug stay away). Controller > BREAK > Starting soon screen:
// DISABLE = start.html fades starting.mov in over the screen, plays it, fades the black away (transparent), THEN the board + bug come back ('start-done').
// ENABLE again = board + bug leave and the screen comes back. 'startOn' is local so the board never flashes on before the screen is up.
const stsWin=()=>$('#sts').contentWindow;
function stsShow(instant){if(!startOn||!stsReady||stsShown)return;stsShown=true;stsWin().postMessage({type:'show',instant:!!instant},'*')}
function finishStart(){if(!startOn)return;clearTimeout(stsT);startOn=false;stsShown=false;if(S)render();bugSync();fetch('/api/startdone',{method:'POST'}).catch(()=>{})}
let stsLast='';
function stsState(){if(!S)return;const pk=t=>({name:t.name||'',rec:t.rec||'',color:t.color,tc:t.tc,logo:t.logo||''}),m=JSON.stringify({home:pk(S.home),away:pk(S.away)});if(m===stsLast)return;
 try{stsWin().postMessage(Object.assign({type:'state'},JSON.parse(m)),'*');stsLast=m}catch(e){}}   // team logos / names / colors for the HOME VS AWAY matchup
function stsSync(){if(!startOn||!S||S.startLive||stsPost)return;stsPost=true;   // tell the server (and the controller) the screen is up
 fetch('/api/startsoon',{method:'POST'}).catch(()=>{}).then(()=>{stsPost=false})}
addEventListener('message',e=>{if(e.source!==$('#sts').contentWindow)return;if(e.data==='start-ready'){stsReady=true;stsLast='';stsState();stsShow(true)}else if(e.data==='start-done')finishStart()});
const stsPing=setInterval(()=>{if(stsReady)return clearInterval(stsPing);try{stsWin().postMessage({type:'ping'},'*')}catch(e){}},150);   // handshake that can't be missed, whichever page finishes loading first
es.addEventListener('start',()=>{if(startOn||breakOn||tdPhase!=='idle')return;if(tagOn)killTag();startOn=true;stsShown=false;if(S)render();bugSync();
 clearTimeout(stsT);stsT=setTimeout(()=>stsShow(false),S&&(S.sb||S.bug)?1000:50)});
es.addEventListener('startend',()=>{if(!startOn)return;clearTimeout(stsT);if(!stsShown){finishStart();return}
 stsWin().postMessage({type:'hide'},'*');stsT=setTimeout(finishStart,60000)});
// SOUND UNLOCK: normal browsers refuse to play sound on a page you have never clicked (OBS allows it, so this never shows there). If sound is blocked, a small
// button shows in the corner; any click or key press unlocks sound for starting.mov (and takes the button away).
(function(){let ac;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 const btn=document.getElementById('snd'),unlock=()=>{ac.resume().then(()=>{btn.classList.remove('on');try{stsWin().postMessage({type:'unmute'},'*')}catch(e){}}).catch(()=>{})};
 setTimeout(()=>{if(ac.state!=='running')btn.classList.add('on')},800);
 addEventListener('click',unlock);addEventListener('keydown',unlock)})();
document.fonts&&document.fonts.ready.then(()=>S&&render());
</script></body></html>
