<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06080d"><title>GIOGAMES Control</title><style>
:root{--bg:#06080d;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--txt:#eef3ff;--mut:#8b98b0;--acc:#19c3ff;--gold:#ffd400;--grn:#22c55e;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--txt);font:16px/1.3 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));
 background:radial-gradient(900px 520px at 12% -8%,rgba(25,195,255,.17),transparent 60%),radial-gradient(700px 520px at 100% 0,rgba(255,212,0,.08),transparent 55%),var(--bg) fixed}

/* ---------- live HUD ---------- */
.hud{position:sticky;top:0;z-index:20;padding:8px 10px 8px;background:linear-gradient(rgba(6,8,13,.96),rgba(6,8,13,.86));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hud>*{max-width:880px;margin-left:auto;margin-right:auto}
.status{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:#5ee38a;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 9px currentColor}
.status.bad{background:var(--red);color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;letter-spacing:0;text-transform:none;line-height:1.35;font-weight:700}
.status.bad::before{display:none}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.side{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:8px 10px;border-radius:14px;background:#0c101a;border-left:4px solid var(--c,#555);box-shadow:inset 0 0 44px -16px var(--c,#555);min-width:0;transition:box-shadow .4s,border-color .4s}
.side.home{align-items:flex-end;text-align:right;border-left:0;border-right:4px solid var(--c,#555)}
.hnrow{display:flex;align-items:center;gap:5px;max-width:100%}.side.home .hnrow{flex-direction:row-reverse}
.hn{font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6deee;min-width:0}
.ball{font-size:12px;filter:drop-shadow(0 0 6px rgba(255,170,60,.9))}
.hs{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:100px;gap:3px}
.hq{font-size:10px;letter-spacing:.24em;color:var(--mut);font-weight:800}
.hc{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 18px rgba(25,195,255,.55)}
.hc.low{color:#ff7b7b;text-shadow:0 0 18px rgba(255,80,80,.8)}
.hplay{flex:none;padding:5px 14px;font-size:11px;letter-spacing:.14em;border-radius:99px;min-width:0}
.sit{text-align:center;font-size:12px;font-weight:700;color:#aebad0;margin-top:6px;letter-spacing:.03em}
.hflag{margin-top:6px;text-align:center;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#111;cursor:pointer;
 background:repeating-linear-gradient(135deg,#ffd400 0 14px,#f0c200 14px 28px);animation:glowGold 1.6s ease-in-out infinite}
@keyframes glowGold{0%,100%{box-shadow:0 0 0 rgba(255,212,0,0)}50%{box-shadow:0 0 22px rgba(255,212,0,.55)}}
.banner{display:none;background:linear-gradient(135deg,#6b4e00,#a67800);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:13px;font-weight:700}

/* ---------- layout ---------- */
main{max-width:880px;margin:0 auto;padding:4px 10px}
.panel{display:none;animation:fade .25s ease}.panel.act{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:0 12px}.grid2>*{min-width:0}
@media(min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card.team{border-top:3px solid var(--c,var(--acc))}
h3{margin:0 0 10px;font-size:11px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;display:flex;align-items:center;gap:8px;font-weight:800}
h3::before{content:'';width:4px;height:12px;border-radius:2px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.sub{margin:14px 0 6px}
.row{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap;align-items:center}
.lb{flex:2;color:#aab6c9;font-size:14px}.note{color:var(--mut);font-size:12.5px;margin:6px 0 0;line-height:1.4}

/* ---------- controls ---------- */
button,.fbtn{font:inherit;font-weight:800;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));color:var(--txt);padding:14px 6px;flex:1;min-width:46px;text-align:center;cursor:pointer;
 box-shadow:0 2px 0 rgba(0,0,0,.4);transition:transform .08s,box-shadow .2s,filter .15s}
button:hover,.fbtn:hover{filter:brightness(1.12)}button:active,.fbtn:active{transform:scale(.94)}button:disabled,select:disabled{opacity:.38;pointer-events:none}
.on{background:linear-gradient(135deg,var(--acc),#74e2ff)!important;color:#00212e!important;border-color:transparent;box-shadow:0 0 20px rgba(25,195,255,.5)}
.go{background:linear-gradient(135deg,#15a34a,#4ade80);color:#04290f;border-color:transparent}
.stop,.red{background:linear-gradient(135deg,#b91c1c,#f87171);color:#fff;border-color:transparent}
.td{background:linear-gradient(135deg,#0f9d46,#3be07c);color:#032410;border-color:transparent;flex:2 1 150px;letter-spacing:.04em;box-shadow:0 0 22px rgba(59,224,124,.28)}
.sm{padding:10px 8px;font-size:13px}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.38);padding:4px;border-radius:15px;border:1px solid var(--line)}
.seg button,.go,.stop{white-space:nowrap}.seg button{border:0;box-shadow:none;background:transparent;padding:12px 2px;font-size:14px;color:#c8d2e6}
input,select{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.42);color:#fff;flex:1;min-width:0}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8b98b0 50%),linear-gradient(135deg,#8b98b0 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:0}
input[type=color]{flex:0 0 58px;padding:3px;height:46px}
input[type=range]{-webkit-appearance:none;appearance:none;height:8px;padding:0;border-radius:8px;background:rgba(255,255,255,.15);width:100%;flex:1 1 100%;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 16px rgba(25,195,255,.8)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 16px rgba(25,195,255,.8)}
.srow{margin:14px 0 4px}.srow .top{display:flex;justify-content:space-between;align-items:center;color:#aab6c9;font-size:14px;margin-bottom:10px}
.pill{background:rgba(25,195,255,.14);color:var(--acc);border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px;min-width:48px;text-align:center}
details{margin:10px 0;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:2px 12px}
summary{padding:12px 0;font-weight:800;color:#cdd8ea;cursor:pointer;font-size:14px}
.thumb{width:46px;height:46px;object-fit:contain;border-radius:10px;background:repeating-conic-gradient(#2a3142 0 25%,#1d2230 0 50%) 0 0/12px 12px;flex:none}

/* ---------- score tab ---------- */
.thead{display:flex;align-items:center;gap:10px;margin-bottom:4px}.sw{width:12px;height:28px;border-radius:5px;background:var(--c,var(--acc));box-shadow:0 0 14px var(--c,var(--acc))}
.ttl{font-weight:900;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl small{color:var(--mut);font-weight:700;font-size:13px}.side-tag{font-size:10px;letter-spacing:.16em;color:var(--mut);font-weight:800}
.big{font-size:84px;font-weight:900;text-align:center;flex:2;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 30px var(--c,transparent)}
.bump{animation:bump .38s cubic-bezier(.2,1.5,.4,1)}@keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.pips{display:flex;gap:6px;flex:2;align-items:center}.pip{flex:0 0 28px;height:10px;border-radius:5px;background:rgba(255,255,255,.12);transition:all .25s}.pip.f{background:#fff;box-shadow:0 0 12px rgba(255,255,255,.65)}
.toh{display:flex;align-items:center;gap:10px;margin:10px 0 2px;color:#aab6c9;font-size:14px}.toh b{color:#fff}.toh .step{flex:0 0 52px;padding:9px 0}

/* ---------- game tab ---------- */
.clk{font-size:84px;font-weight:900;text-align:center;flex:1;font-variant-numeric:tabular-nums;line-height:1;padding:8px 0;text-shadow:0 0 34px rgba(25,195,255,.55);letter-spacing:.02em}
.clk.low{color:#ff7b7b;text-shadow:0 0 34px rgba(255,80,80,.75)}
.dist{font-size:26px;font-weight:900;text-align:center}

/* ---------- flag tab ---------- */
.flagbtn{width:100%;font-size:36px;letter-spacing:.28em;padding:34px 6px;border-radius:20px;color:#111;border:0;
 background:repeating-linear-gradient(135deg,#ffd400 0 20px,#f0c200 20px 40px);box-shadow:0 0 44px rgba(255,212,0,.35),0 4px 0 #8a6d00}
.flagbtn.act{background:linear-gradient(135deg,#8f1616,#ef4444);color:#fff;letter-spacing:.1em;box-shadow:0 0 0 rgba(239,68,68,.6),0 4px 0 #5c0b0b;animation:pulseRed 1.5s infinite;font-size:30px}
@keyframes pulseRed{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55),0 4px 0 #5c0b0b}70%{box-shadow:0 0 0 22px rgba(239,68,68,0),0 4px 0 #5c0b0b}100%{box-shadow:0 0 0 0 rgba(239,68,68,0),0 4px 0 #5c0b0b}}
#flagopts{animation:fade .35s ease}

/* ---------- show tab ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tagbtn{width:100%;font-size:19px;letter-spacing:.14em;padding:22px 6px;border-radius:18px;border:0;color:#00212e;position:relative;overflow:hidden;
 background:linear-gradient(135deg,#19c3ff,#8aeaff 55%,#19c3ff);box-shadow:0 0 36px rgba(25,195,255,.38),0 4px 0 #0a6d91}
.tagbtn::after{content:'';position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-80px}100%{left:110%}}
.winbtn{width:100%;font-size:22px;letter-spacing:.16em;padding:30px 6px;border-radius:20px;border:0;color:#02281a;background:linear-gradient(135deg,#12b76a,#7cf0b4 55%,#12b76a);box-shadow:0 0 40px rgba(18,183,106,.35),0 4px 0 #0a6b3f}
.winbtn.live{background:linear-gradient(135deg,#8f1616,#ef4444);color:#fff;box-shadow:0 0 0 rgba(239,68,68,.6),0 4px 0 #5c0b0b;animation:pulseRed 1.5s infinite}
.winbtn.ending{filter:saturate(.4) brightness(.8);pointer-events:none}
.winbtn:disabled{filter:saturate(.3) brightness(.7);box-shadow:none}
.breakbtn{width:100%;font-size:26px;letter-spacing:.2em;padding:34px 6px;border-radius:20px;border:0;color:#2a1600;background:linear-gradient(135deg,#ffb000,#ffd76a 55%,#ffb000);box-shadow:0 0 40px rgba(255,176,0,.35),0 4px 0 #8a5d00}
.breakbtn.live{background:linear-gradient(135deg,#8f1616,#ef4444);color:#fff;box-shadow:0 0 0 rgba(239,68,68,.6),0 4px 0 #5c0b0b;animation:pulseRed 1.5s infinite}
.breakbtn.ending{filter:saturate(.4) brightness(.8);pointer-events:none}
.tagbtn.live{background:linear-gradient(135deg,#ff4d4d,#ff9a9a 55%,#ff4d4d);box-shadow:0 0 36px rgba(255,77,77,.38),0 4px 0 #8f1d1d;color:#2b0000}
.tagbtn.busy{filter:saturate(.5) brightness(.8);pointer-events:none}.tagbtn.busy::after{display:none}
.tagbtn i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.4);pointer-events:none}.tagbtn.busy i{width:100%;transition:width 6.4s linear}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 4px;font-size:14px;border-radius:16px}
.tile::after{content:'OFF';font-size:10px;letter-spacing:.22em;opacity:.65}.tile.on::after{content:'ON';opacity:.85}

.startbtn{width:100%;font-size:19px;letter-spacing:.14em;padding:26px 6px;border-radius:18px;text-transform:uppercase}
.tile.startbtn.playing{filter:saturate(.55) brightness(.85);pointer-events:none}.tile.startbtn.playing::after{content:'PLAYING INTRO…';opacity:.95}
.hint{margin:10px 0 0;font-size:13px;font-weight:700;color:#cdd8ea;text-align:center;letter-spacing:.02em}
/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:14px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(6,8,13,.92) 45%);pointer-events:none}
.tabs-in{pointer-events:auto;display:flex;gap:4px;width:100%;max-width:600px;background:rgba(17,21,32,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:5px;box-shadow:0 12px 44px rgba(0,0,0,.65)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;border-radius:17px;border:0;background:transparent;color:var(--mut);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;min-width:0;box-shadow:none;position:relative}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.act{color:#00212e;background:linear-gradient(135deg,var(--acc),#7fe5ff);box-shadow:0 0 24px rgba(25,195,255,.5)}
.tab.alert{color:var(--gold)}.tab.alert.act{color:#3a2c00;background:linear-gradient(135deg,#ffd400,#ffe873)}
.tab.alert::after{content:'';position:absolute;top:6px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:glowGold 1.2s infinite}
</style></head><body>

<header class="hud">
 <div class="status" id="status">Connecting…</div>
 <div class="banner" id="tdbanner">TOUCHDOWN playing — points are added when the board comes back up. <button class="sm" onclick="post('tdnow')" style="margin-top:6px;width:100%">Add points now</button></div>
 <div class="board">
  <div class="side away" id="h-away"><div class="hnrow"><span class="ball" id="h-away-ball">🏈</span><span class="hn" id="h-away-name"></span></div><div class="hs" id="h-away-score"></div></div>
  <div class="mid"><div class="hq" id="hqtr">—</div><div class="hc" id="hclk">12:00</div><button class="hplay go" id="hplay" onclick="S&amp;&amp;ck(S.clock.running?'stop':'start')">▶ START</button></div>
  <div class="side home" id="h-home"><div class="hnrow"><span class="ball" id="h-home-ball">🏈</span><span class="hn" id="h-home-name"></span></div><div class="hs" id="h-home-score"></div></div>
 </div>
 <div class="sit" id="hsit"></div>
 <div class="hflag" id="hflag" style="display:none" onclick="tab('flag')"></div>
</header>

<main id="app"></main>

<nav class="tabs"><div class="tabs-in">
 <button class="tab" id="tab-score" onclick="tab('score')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M12 6v12M7 12h.01M17 12h.01"/></svg>Score</button>
 <button class="tab" id="tab-game" onclick="tab('game')"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V9.5M9.5 3h5M18.5 6.5l1.5-1.5"/></svg>Game</button>
 <button class="tab" id="tab-flag" onclick="tab('flag')"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5"/></svg>Flag</button>
 <button class="tab" id="tab-show" onclick="tab('show')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Show</button>
 <button class="tab" id="tab-break" onclick="tab('break')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg>Break</button>
 <button class="tab" id="tab-settings" onclick="tab('settings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Setting</button>
 <button class="tab" id="tab-teams" onclick="tab('teams')"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Teams</button>
</div></nav>

<script src="core.js"></script><script src="turn-config.js"></script><script src="hub.js"></script><script src="cam.js"></script>
<script>
const bad=m=>{const e=document.getElementById('status');e.className='status bad';e.textContent=m};
const post=(p,b)=>fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>{if(!r.ok)bad('Server error '+r.status+' on '+p)}).catch(()=>bad("Can't reach the scoreboard. Local mode: is the black Node window open? Website mode: is the controller page still open?"));
if(location.protocol==='file:')setTimeout(()=>bad('This page was opened as a file. Open http://localhost:3000 instead (run start-windows.bat first).'),0);
const sc=(t,d)=>post('score',{team:t,delta:d}),to=(t,d)=>post('to',{team:t,delta:d}),td=t=>post('touchdown',{team:t}),st=b=>post('state',b),ck=(a,ms)=>post('clock',{action:a,ms});
// helpers to build nested patches without string gymnastics
const setT=(k,key,v)=>st({[k]:{[key]:v}}),setTD=(k,key,v)=>st({[k]:{td:{[key]:v}}}),setUI=(key,v)=>st({ui:{[key]:v}});
const crow=(id,label,fn)=>`<div class=row><span class=lb>${label}</span><input type=color id=${id} onchange="${fn}"></div>`;
function readImg(file,max=400){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=im.width||300,h=im.height||300,k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(file)})}
async function upLogo(k,inp){if(inp.files[0]){setT(k,'logo',await readImg(inp.files[0]));inp.value=''}}
async function upTD(k,inp){if(inp.files[0]){st({[k]:{td:{logo:await readImg(inp.files[0]),style:'custom'}}});inp.value=''}}
function useSb(k){if(!S[k].logo){alert('Upload a scoreboard logo first.');return}st({[k]:{td:{style:'custom',color:S[k].color,logo:S[k].logo}}})}

// ---- SCORE tab: scoring + timeouts per team
const teamScore=(k,l)=>`<div class="card team" id=${k}-card><div class=thead><span class=sw></span><span class=ttl id=${k}-title></span><span class=side-tag>${l}</span></div>
<div class=row><button onclick="sc('${k}',-1)">−1</button><div class=big id=${k}-score></div><button onclick="sc('${k}',1)">+1</button></div>
<div class=row><button onclick="sc('${k}',2)">+2</button><button onclick="sc('${k}',3)">+3</button><button onclick="sc('${k}',7)">+7</button><button class=td id=${k}-tdb onclick="td('${k}')">TOUCHDOWN +6</button></div>
<div class=toh><span>Timeouts</span><span class=pips id=${k}-pips><i class=pip></i><i class=pip></i><i class=pip></i></span><b id=${k}-to></b><button class="step sm" onclick="to('${k}',-1)">−</button><button class="step sm" onclick="to('${k}',1)">+</button></div></div>`;

// ---- TEAMS tab: look + touchdown animation per team
const teamLook=(k,l)=>`<div class="card team" id=${k}-lcard><h3>${l}</h3>
<details open><summary>Scoreboard look (name, record, colors, logo)</summary>
<div class=row><input id=${k}-name placeholder="Team name" onchange="setT('${k}','name',this.value)"><input id=${k}-rec placeholder="Record" maxlength=8 style="flex:0 0 84px" onchange="setT('${k}','rec',this.value)"></div>
${crow(k+'-color','Team color',`setT('${k}','color',this.value)`)}${crow(k+'-tc','Text color',`setT('${k}','tc',this.value)`)}
<div class=row><img class=thumb id=${k}-logoimg><label class=fbtn>Upload logo<input type=file accept="image/*" hidden onchange="upLogo('${k}',this)"></label><button class=sm onclick="setT('${k}','logo','')">Remove</button></div>
<div class=note>Transparent PNG works best.</div></details>
<details><summary>Touchdown animation (logo + color)</summary>
