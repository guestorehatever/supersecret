function animLine(L,t,tIn,tOut,st,popZ){const n=L.letters.length;
 L.letters.forEach((m,k)=>{const u=m.userData,qi=cl((t-tIn-k*st)/.5),qo=cl((t-tOut-(n-1-k)*.02)/.4),b=eoB(qi),z=.13+(1-eo3(qi))*popZ-eo3(qo)*3;
  m.visible=qi>0&&qo<1;m.position.set(u.x,u.y+.025*Math.sin(t*1.6+k*.6),z);
  m.rotation.set(-(1-b)*1.5+qo*1.2,(1-b)*.8-qo*.9,0);m.scale.setScalar(Math.max(.001,eo3(qi)*(1-eo3(qo))))})}

function frame(t){
 const e=eo3(cl((t-.05)/.8)),ex=eo3(cl((t-T_OUT-.15)/.7));
 brand.position.set(BX-16*(1-e)+18*ex,BY+.04*Math.sin(t*1.3),0);
 brand.rotation.set(.05*Math.sin(t*.9),-1.35*(1-e)+1.2*ex+.1*Math.sin(t*.7)*e*(1-ex),0);
 ball.children[0].rotation.y+=.03;ball.position.y=.05*Math.sin(t*1.7);
 animLine(L_giog,t,.45,T_OUT+.15,.05,4);animLine(L_foot,t,.8,T_OUT+.15,.04,4);
 animLine(L_watch,t,1.15,T_OUT+.1,.04,5);
 animLine(L_play,t,1.95,T_OUT+.05,.03,5);animLine(L_name,t,2.25,T_OUT,Math.min(.045,.8/Math.max(1,L_name.letters.length)),6);
 const r1=eo3(cl((t-1.5)/.6))*(1-eo3(cl((t-T_OUT)/.4))),r2=eo3(cl((t-2.6)/.6))*(1-eo3(cl((t-T_OUT)/.4)));
 rule1.scale.set(Math.max(.001,8.4*r1),1,1);rule2.scale.set(Math.max(.001,(hasName?8.2:0.001)*r2),1,1);rule2.visible=hasName;
 const gl=cl((t-.3)/.8)*(1-cl((t-T_OUT)/.7));glow.material.opacity=gl*(.34+.08*Math.sin(t*2));
 streaks.forEach(m=>{const u=m.userData,q=cl((t-u.d)/.75),q2=cl((t-T_OUT-.1-u.d)/.7);
  m.visible=(q>0&&q<1)||(q2>0&&q2<1);m.position.x=q2>0?(18-36*q2):(-18+36*q);m.material.opacity=1});
 sparks.material.opacity=.9*cl((t-.6)/.8)*(1-cl((t-T_OUT-.2)/.5));
 for(let i=0;i<NSP;i++){const s=spSeed[i];spPos[i*3]=s[0]+.3*Math.sin(t*.6+s[4]);spPos[i*3+1]=((s[1]+t*s[3]+2.3)%4.6)-2.3;spPos[i*3+2]=s[2]}spGeo.attributes.position.needsUpdate=true;
 // light sweeps across the chrome while the tag holds
 const ts=t<2.5?t:2.5+((t-2.5)%7),ph=(ts-2.5)/1.9,ph2=(ts-3.5)/1.5,sw=ph>0&&ph<1?ph:(ph2>0&&ph2<1?ph2:-1);
 sweep.position.set(-8+16*Math.max(0,sw),.6,2.6);sweep.intensity=sw>=0?4*Math.sin(Math.PI*sw):0;
 scrim.style.opacity=(.9*sm(0,.5,t)*(1-sm(T_OUT+.2,T_END-.15,t))).toFixed(3);
 cam.position.x=.3*Math.sin(t*.45);cam.position.z=CZ-.5*sm(0,5,t);cam.lookAt(0,0,0);
}

function setText(name){
 killLine(L_watch);killLine(L_play);killLine(L_name);
 const txt=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\u2018\u2019`]/g,"'").toUpperCase().trim();
 hasName=[...txt].some(x=>TXT.G[x]&&x!==' ');
 BX=hasName?-5.3:0;
 L_watch=buildLine(root,TXT,"YOU'RE WATCHING",{cap:.55,cx:BX,yc:1.7,maxW:8.6,track:.2,mats:[mChrome,mSteel],chrome:true,depth:.22});
 rule1.position.x=BX;
 if(hasName){const RX=4.9;
  L_play=buildLine(root,TXT,'PLAYING AT THE',{cap:.4,cx:RX,yc:.55,maxW:7,track:.28,mats:[mAcc,mAccSide],chrome:false,depth:.16});
  L_name=buildLine(root,TXT,txt,{cap:.8,cx:RX,yc:-.4,maxW:8.2,track:.06,mats:[mChrome,mSteel],chrome:true,depth:.26});
  rule2.position.x=RX}
 else{L_play={letters:[]};L_name={letters:[]}}
 root.position.y=0}

let active=false,t0=0;
function loop(now){if(!active)return;const t=(now-t0)/1000;
 if(t>=T_END){active=false;cv.style.display='none';scrim.style.opacity=0;R.clear();parent.postMessage('tag-done','*');return}
 frame(t);R.render(scene,cam);requestAnimationFrame(loop)}
function play(name,secs,hold){T_OUT=hold?1e9:Math.max(3.9,(+secs||6)-1.05);T_END=hold?1e9:T_OUT+1.05;resize();setText(name);cv.style.display='block';active=true;t0=performance.now();requestAnimationFrame(loop)}
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='play')play(d.stadium,d.secs,d.hold);
 if(d&&d.type==='end'&&active&&T_OUT>1e8){const t=(performance.now()-t0)/1000;T_OUT=Math.max(t,3.4);T_END=T_OUT+1.05}
 if(d&&d.type==='stop'){active=false;cv.style.display='none';scrim.style.opacity=0}});
resize();
// test hook: tag.html?demo&at=3&name=Memorial%20Stadium  renders one frozen frame
if(/[?&]demo/.test(location.search)){const q=new URLSearchParams(location.search);setText(q.get('name')||'');cv.style.display='block';
 for(let tt=0;tt<=+(q.get('at')||3);tt+=1/60)frame(tt);R.render(scene,cam)}
</script></body></html>
