 L.letters.forEach((m,k)=>{const u=m.userData,qi=cl((t-tIn-k*st)/.5),qo=cl((t-tOut-(n-1-k)*.02)/.4),b=eoB(qi),z=.13+(1-eo3(qi))*popZ-eo3(qo)*3;
  m.visible=qi>0&&qo<1;m.position.set(u.x,u.y+.025*Math.sin(t*1.6+k*.6),z);
  m.rotation.set(-(1-b)*1.5+qo*1.2,(1-b)*.8-qo*.9,0);m.scale.setScalar(Math.max(.001,eo3(qi)*(1-eo3(qo))))})}


const BRK_Y=1.7;
rule1.position.set(0,-.1,.05);rule2.position.set(0,-1.78,.05);glow.scale.set(22,12,1);
[2.6,.8,-.8,3.4,-2.4].forEach((y,i)=>streaks[i].position.y=y);
spSeed.forEach(s=>{s[0]=Math.random()*20-10;s[1]=Math.random()*9-4.5});

function frame(t){
 const e=eo3(cl((t-.05)/.8));
 brand.position.set(-14*(1-e),BRK_Y+.05*Math.sin(t*1.3),0);
 brand.rotation.set(.05*Math.sin(t*.9),-1.35*(1-e)+.1*Math.sin(t*.7)*e,0);
 ball.children[0].rotation.y+=.03;ball.position.y=.05*Math.sin(t*1.7);
 animLine(L_giog,t,.45,1e9,.05,4);animLine(L_foot,t,.8,1e9,.04,4);animLine(L_msg,t,1.6,1e9,.04,5);
 const r1=eo3(cl((t-1.3)/.6)),r2=eo3(cl((t-1.7)/.6));
 rule1.scale.set(Math.max(.001,8*r1),1,1);rule2.scale.set(Math.max(.001,11*r2),1,1);
 glow.material.opacity=cl((t-.3)/.8)*(.34+.08*Math.sin(t*2));
 streaks.forEach(m=>{const u=m.userData,tt=t-u.d-.3,q=tt>=0?(tt%9)/.75:9;m.visible=q<1;if(q<1)m.position.x=-18+36*q;m.material.opacity=1});
 sparks.material.opacity=.9*cl((t-.6)/.8);
 for(let i=0;i<NSP;i++){const s=spSeed[i];spPos[i*3]=s[0]+.3*Math.sin(t*.6+s[4]);spPos[i*3+1]=((s[1]+t*s[3]+4.5)%9)-4.5;spPos[i*3+2]=s[2]}spGeo.attributes.position.needsUpdate=true;
 const ts=t<2.5?t:2.5+((t-2.5)%7),ph=(ts-2.5)/1.9,ph2=(ts-3.5)/1.5,sw=ph>0&&ph<1?ph:(ph2>0&&ph2<1?ph2:-1);
 sweep.position.set(-8+16*Math.max(0,sw),.6,2.6);sweep.intensity=sw>=0?4*Math.sin(Math.PI*sw):0;
 cam.position.x=.3*Math.sin(t*.45);cam.position.z=CZ-.5*sm(0,5,Math.min(t,5));cam.lookAt(0,0,0);
}
let active=false,t0=0,shown=false,tms=[];
const $=id=>document.getElementById(id),bg=$('bg'),content=$('content'),sbar=$('sc');
const T=(f,ms)=>{tms.push(setTimeout(f,ms))},clearT=()=>{tms.forEach(clearTimeout);tms=[]};
function loop(now){if(!active)return;frame((now-t0)/1000);R.render(scene,cam);requestAnimationFrame(loop)}
function show(){clearT();if(shown)return;shown=true;content.classList.remove('out');bg.classList.add('on');
 T(()=>{resize();cv.style.display='block';active=true;t0=performance.now();requestAnimationFrame(loop);T(()=>sbar.classList.add('on'),1800)},850)}
function hide(){clearT();if(!shown){parent.postMessage('break-done','*');return}
 content.classList.add('out');
 T(()=>{bg.classList.remove('on');
  T(()=>{active=false;cv.style.display='none';R.clear();sbar.classList.remove('on');content.classList.remove('out');shown=false;parent.postMessage('break-done','*')},900)},650)}
function setState(d){
 for(const k of['away','home']){const t=d[k];if(!t)continue;const tm=$(k+'-tm'),im=tm.querySelector('img'),n=$(k+'-n');
  tm.style.setProperty('--c',t.color||'#888');
  if(t.logo){if(im.dataset.src!==t.logo){im.src=t.logo;im.dataset.src=t.logo}tm.classList.remove('nologo')}else{im.removeAttribute('src');im.dataset.src='';tm.classList.add('nologo')}
  if(String(t.score)!==n.textContent){const had=n.textContent!=='';n.textContent=t.score;if(had){n.classList.remove('pop');void n.offsetWidth;n.classList.add('pop')}}}
 if(d.scoreBg)document.documentElement.style.setProperty('--sbg',d.scoreBg)}
addEventListener('message',e=>{const d=e.data;if(!d)return;if(d.type==='state')setState(d);else if(d.type==='show')show();else if(d.type==='hide')hide()});
resize();
